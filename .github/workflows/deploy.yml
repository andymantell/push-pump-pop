name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A run in progress always finishes, and only the newest push waits behind it.
# Cancelling in-progress runs meant a steady stream of pushes never deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # npm test, split so the careers playtest side by side, each in four parts (CI
  # time is what decides how long an update takes to reach the iPad).
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every part finish, so one failure doesn't hide others.
      fail-fast: false
      matrix:
        ride: [skate, scooter, mtb]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit checks
        if: matrix.ride == 'skate' && matrix.shard == 1
        run: npm run test:unit
      - name: Playtest every track with a human-speed bot
        run: npm run playtest:${{ matrix.ride }} -- --shard=${{ matrix.shard }}/4 --seen-out=seen-${{ matrix.ride }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: seen-${{ matrix.ride }}-${{ matrix.shard }}
          path: seen-${{ matrix.ride }}-${{ matrix.shard }}.json
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: release notes are grouped by the commit that added them
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: seen-skate-*
          path: seen/skate
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: seen-scooter-*
          path: seen/scooter
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: seen-mtb-*
          path: seen/mtb
          merge-multiple: true
      - run: npm ci
      - name: Check every trick got landed somewhere
        run: |
          for ride in skate scooter mtb; do
            npm run playtest:$ride -- --check-tricks=seen/$ride
          done
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
